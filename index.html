<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>写真タップ動画再生アプリ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    overscroll-behavior: none;
  }

  /* ヘッダー */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    padding-top: env(safe-area-inset-top);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    z-index: 50;
  }
  #editToggle {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 8px 16px;
    font-size: 15px;
    margin-top: env(safe-area-inset-top);
  }
  #editToggle.active {
    background: #0a84ff;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    padding: 10px;
    padding-top: calc(56px + env(safe-area-inset-top));
  }
  .cell {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #2c2c2e;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .cell .placeholder {
    color: #8e8e93;
    font-size: 13px;
    text-align: center;
    padding: 8px;
    pointer-events: none;
  }
  .cell:active {
    filter: brightness(0.8);
  }

  /* 編集モードのオーバーレイUI */
  .cell .editLayer {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 6px;
    padding: 8px;
  }
  body.editing .cell .editLayer { display: flex; }
  .editLayer button {
    font-size: 12px;
    padding: 6px 4px;
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.92);
    color: #1c1c1e;
  }
  .editLayer button.videoBtn {
    background: #0a84ff;
    color: #fff;
  }
  .editLayer input[type="file"] {
    display: none;
  }
  .statusDot {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 10px;
    height: 10px;
    border-radius: 5px;
    background: #ff9f0a;
  }
  .statusDot.ok { background: #30d158; }

  /* 全画面動画オーバーレイ */
  #videoOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #videoOverlay.show { display: flex; }
  #videoOverlay video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #closeBtn {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border-radius: 22px;
    background: rgba(255,255,255,0.85);
    border: none;
    font-size: 20px;
    color: #1c1c1e;
    z-index: 1001;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 2000;
    max-width: 80%;
    text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="header">
  <button id="editToggle">編集</button>
</div>

<div class="grid" id="grid"></div>

<div id="videoOverlay">
  <button id="closeBtn" aria-label="閉じる">✕</button>
  <video id="player" playsinline controls></video>
</div>

<div id="toast"></div>

<script>
/* ==========================================================
   9マス分のデータを IndexedDB に保存する仕組み。
   一度「編集」から写真・動画を選ぶと、次回開いたときも
   同じ内容がそのまま表示されます（iPhone/iPad本体に保存）。
   ========================================================== */

const DB_NAME = "photoVideoAppDB";
const DB_VERSION = 1;
const STORE_NAME = "slots";
const SLOT_COUNT = 9;

let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const database = req.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getSlot(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function putSlot(record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(record);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

const grid = document.getElementById("grid");
const overlay = document.getElementById("videoOverlay");
const player = document.getElementById("player");
const closeBtn = document.getElementById("closeBtn");
const editToggle = document.getElementById("editToggle");

// メモリ上のURLキャッシュ（Blob -> ObjectURL）
const objectUrls = {};

function cellId(i) { return "slot" + i; }

function buildCell(i) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.index = i;

  const img = document.createElement("img");
  img.style.display = "none";
  cell.appendChild(img);

  const placeholder = document.createElement("div");
  placeholder.className = "placeholder";
  placeholder.textContent = "写真未登録\n(" + (i + 1) + ")";
  placeholder.style.whiteSpace = "pre-line";
  cell.appendChild(placeholder);

  const dot = document.createElement("div");
  dot.className = "statusDot";
  cell.appendChild(dot);

  // 編集レイヤー
  const editLayer = document.createElement("div");
  editLayer.className = "editLayer";

  const photoBtn = document.createElement("button");
  photoBtn.textContent = "写真を選ぶ";
  const photoInput = document.createElement("input");
  photoInput.type = "file";
  photoInput.accept = "image/*";
  photoBtn.addEventListener("click", (e) => { e.stopPropagation(); photoInput.click(); });
  photoInput.addEventListener("change", (e) => handlePhotoSelect(i, e));

  const videoBtn = document.createElement("button");
  videoBtn.textContent = "動画を選ぶ";
  videoBtn.className = "videoBtn";
  const videoInput = document.createElement("input");
  videoInput.type = "file";
  videoInput.accept = "video/*";
  videoBtn.addEventListener("click", (e) => { e.stopPropagation(); videoInput.click(); });
  videoInput.addEventListener("change", (e) => handleVideoSelect(i, e));

  editLayer.appendChild(photoBtn);
  editLayer.appendChild(photoInput);
  editLayer.appendChild(videoBtn);
  editLayer.appendChild(videoInput);
  cell.appendChild(editLayer);

  cell.addEventListener("click", async () => {
    if (document.body.classList.contains("editing")) return;
    const slot = await getSlot(cellId(i));
    if (slot && slot.videoBlob) {
      openVideo(slot.videoBlob);
    } else {
      showToast("この写真には動画が登録されていません");
    }
  });

  grid.appendChild(cell);
}

async function handlePhotoSelect(i, e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const existing = (await getSlot(cellId(i))) || { id: cellId(i) };
    existing.photoBlob = file;
    await putSlot(existing);
    await refreshCell(i);
    showToast("写真を登録しました");
  } catch (err) {
    showToast("保存エラー: " + err.message);
    console.error(err);
  }
  e.target.value = "";
}

async function handleVideoSelect(i, e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const existing = (await getSlot(cellId(i))) || { id: cellId(i) };
    existing.videoBlob = file;
    await putSlot(existing);
    await refreshCell(i);
    showToast("動画を登録しました");
  } catch (err) {
    showToast("保存エラー: " + err.message);
    console.error(err);
  }
  e.target.value = "";
}

async function refreshCell(i) {
  const cell = grid.children[i];
  const img = cell.querySelector("img");
  const placeholder = cell.querySelector(".placeholder");
  const dot = cell.querySelector(".statusDot");

  const slot = await getSlot(cellId(i));

  if (slot && slot.photoBlob) {
    if (objectUrls[cellId(i)]) URL.revokeObjectURL(objectUrls[cellId(i)]);
    const url = URL.createObjectURL(slot.photoBlob);
    objectUrls[cellId(i)] = url;
    img.src = url;
    img.style.display = "block";
    placeholder.style.display = "none";
  } else {
    img.style.display = "none";
    placeholder.style.display = "block";
  }

  const hasVideo = !!(slot && slot.videoBlob);
  dot.classList.toggle("ok", hasVideo);
}

function openVideo(videoBlob) {
  const url = URL.createObjectURL(videoBlob);
  player.src = url;
  overlay.classList.add("show");

  const el = overlay;
  if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (player.webkitEnterFullscreen) {
    player.play().catch(() => {});
    player.webkitEnterFullscreen();
  }
  player.play().catch(() => {});

  player._tempUrl = url;
}

function closeVideo() {
  player.pause();
  if (player._tempUrl) {
    URL.revokeObjectURL(player._tempUrl);
    player._tempUrl = null;
  }
  player.removeAttribute("src");
  player.load();
  overlay.classList.remove("show");
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  } else if (document.webkitFullscreenElement) {
    document.webkitExitFullscreen();
  }
}

closeBtn.addEventListener("click", closeVideo);
player.addEventListener("ended", closeVideo);
player.addEventListener("webkitendfullscreen", closeVideo);

editToggle.addEventListener("click", () => {
  document.body.classList.toggle("editing");
  editToggle.classList.toggle("active");
  editToggle.textContent = document.body.classList.contains("editing") ? "完了" : "編集";
});

async function init() {
  if (location.protocol === "file:") {
    document.body.innerHTML =
      '<div style="color:#fff;padding:24px;font-size:16px;line-height:1.7;">' +
      'このアプリは file:// (ファイルを直接開く方法) では動作しません。<br><br>' +
      '写真・動画の保存機能(IndexedDB)は、Safariのセキュリティ制限により、' +
      'ローカルファイルとして開いた場合は正しく動きません。<br><br>' +
      'GitHub PagesなどでWeb上に公開し、https:// から始まるURLで開いてください。' +
      '</div>';
    return;
  }
  try {
    db = await openDB();
  } catch (err) {
    document.body.innerHTML =
      '<div style="color:#fff;padding:24px;font-size:16px;">データベースを開けませんでした: ' + err.message + '</div>';
    return;
  }
  for (let i = 0; i < SLOT_COUNT; i++) {
    buildCell(i);
  }
  for (let i = 0; i < SLOT_COUNT; i++) {
    await refreshCell(i);
  }
}

init();
</script>

</body>
</html>
